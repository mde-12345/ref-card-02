name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ref-card-02
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ref-card-02

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Test image
        run: |
          docker run -d --name app -p 8080:80 $IMAGE_NAME:latest
          curl -f --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8080
          docker rm -f app

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push $IMAGE_NAME:latest

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE_NAME:latest $GHCR_IMAGE:latest
          docker push $GHCR_IMAGE:latest
